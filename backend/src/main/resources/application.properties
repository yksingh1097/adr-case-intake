spring.application.name=adr-case-intake
server.port=8080
app.catalog-path=

app.pipeline.enabled=false
app.pipeline.only=
app.fixtures-dir=

# replay = answer from fixtures/ (no key, no network); record = call the model and save fixtures; live = call the model only
app.llm.mode=replay
app.llm.provider=gemini
app.llm.base-url=https://generativelanguage.googleapis.com/v1beta
app.llm.model=gemini-3.5-flash-lite
app.llm.api-key-env=GEMINI_API_KEY
app.llm.requests-per-minute=5
app.llm.max-attempts=5
app.llm.first-backoff-seconds=15
app.llm.timeout-seconds=120
